<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
    <defs>
        <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1C1917"/>
            <stop offset="100%" stop-color="#2D2926"/>
        </linearGradient>
        <radialGradient id="ogGlow" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#A16207" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#1C1917" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="ogAccent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#A16207" stop-opacity="0"/>
            <stop offset="50%" stop-color="#A16207" stop-opacity="1"/>
            <stop offset="100%" stop-color="#A16207" stop-opacity="0"/>
        </linearGradient>
    </defs>
    
    <rect width="1200" height="630" fill="url(#ogBg)"/>
    <ellipse cx="360" cy="189" rx="500" ry="350" fill="url(#ogGlow)"/>
    
    <!-- Logo -->
    <g transform="translate(600, 200)">
        <path d="M0 -50L-30 -10v40l30 30 30-30V-10L0 -50Z" fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>
        <path d="M0 -20v60" stroke="white" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Title -->
    <text x="600" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="56" font-weight="500" fill="white" letter-spacing="-1">NOVA</text>
    <text x="600" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="300" fill="rgba(255,255,255,0.7)">Premium Luxury Experience</text>
    
    <!-- Accent line -->
    <line x1="450" y1="450" x2="750" y2="450" stroke="url(#ogAccent)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Tagline -->
    <text x="600" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.5)">Exceptional Craftsmanship, Timeless Elegance</text>
</svg>