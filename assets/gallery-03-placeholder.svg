<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
    <defs>
        <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1C1917"/>
            <stop offset="50%" stop-color="#2D2926"/>
            <stop offset="100%" stop-color="#1C1917"/>
        </linearGradient>
        <radialGradient id="g3Glow" cx="50%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#A16207" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#1C1917" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="gemGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#F5E6C8" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#A16207" stop-opacity="0"/>
        </radialGradient>
    </defs>
    
    <rect width="800" height="1000" fill="url(#g3)"/>
    <ellipse cx="400" cy="300" rx="350" ry="250" fill="url(#g3Glow)"/>
    
    <!-- Abstract gem/accessory shapes -->
    <g transform="translate(400, 500)">
        <!-- Central gem -->
        <polygon points="0,-100 60,-40 60,40 0,100 -60,40 -60,-40" fill="url(#gemGlow)" opacity="0.3"/>
        <polygon points="0,-100 60,-40 60,40 0,100 -60,40 -60,-40" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
        <polygon points="0,-70 40,-30 40,30 0,70 -40,30 -40,-30" fill="none" stroke="#A16207" stroke-width="1" opacity="0.5"/>
        
        <!-- Facet lines -->
        <g stroke="rgba(161,98,7,0.3)" stroke-width="1">
            <line x1="0" y1="-100" x2="0" y2="100"/>
            <line x1="-60" y1="-40" x2="60" y2="40"/>
            <line x1="-60" y1="40" x2="60" y2="-40"/>
        </g>
        
        <!-- Surrounding smaller elements -->
        <g fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1">
            <circle cx="-200" cy="-100" r="50"/>
            <circle cx="200" cy="-100" r="50"/>
            <circle cx="-200" cy="100" r="50"/>
            <circle cx="200" cy="100" r="50"/>
        </g>
        
        <g fill="#A16207" opacity="0.6">
            <circle cx="-200" cy="-100" r="8"/>
            <circle cx="200" cy="-100" r="8"/>
            <circle cx="-200" cy="100" r="8"/>
            <circle cx="200" cy="100" r="8"/>
        </g>
    </g>
    
    <!-- Placeholder text area -->
    <g fill="rgba(255,255,255,0.1)" transform="translate(400, 850)">
        <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="400" fill="rgba(255,255,255,0.3)">gallery-03.jpg</text>
        <text x="0" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.25)">Third gallery reference image</text>
    </g>
</svg>