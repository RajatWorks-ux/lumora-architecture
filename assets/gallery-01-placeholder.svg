<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
    <defs>
        <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#C4963A"/>
            <stop offset="100%" stop-color="#A16207"/>
        </linearGradient>
        <radialGradient id="g1Glow" cx="50%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#F5E6C8" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#C4963A" stop-opacity="0"/>
        </radialGradient>
    </defs>
    
    <rect width="800" height="1000" fill="url(#g1)"/>
    <ellipse cx="400" cy="300" rx="350" ry="250" fill="url(#g1Glow)"/>
    
    <!-- Abstract jewelry shapes -->
    <g fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2">
        <circle cx="400" cy="500" r="120"/>
        <circle cx="400" cy="500" r="80"/>
        <circle cx="400" cy="500" r="40"/>
        <ellipse cx="400" cy="500" rx="160" ry="60" transform="rotate(30 400 500)"/>
        <ellipse cx="400" cy="500" rx="160" ry="60" transform="rotate(-30 400 500)"/>
    </g>
    
    <!-- Sparkles -->
    <g fill="rgba(255,255,255,0.6)">
        <polygon points="400,380 402,385 408,385 403,389 405,394 400,391 395,394 397,389 392,385 398,385"/>
        <polygon points="520,420 521,524 525,524 522,527 523,530 520,528 517,530 518,527 515,524 519,524" transform="scale(0.3)"/>
        <polygon points="280,580 281,583 284,583 282,585 283,587 280,586 277,587 278,585 276,583 279,583" transform="scale(0.4)"/>
    </g>
    
    <!-- Placeholder text area -->
    <g fill="rgba(255,255,255,0.2)" transform="translate(400, 850)">
        <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="400" fill="rgba(255,255,255,0.5)">gallery-01.jpg</text>
        <text x="0" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.4)">First gallery reference image</text>
    </g>
</svg>